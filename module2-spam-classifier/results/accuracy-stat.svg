<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .card { fill: #f0f6ff; stroke: #1f6feb; stroke-width: 2; }
    .num { fill: #1f6feb; font-size: 48px; font-weight: 800; text-anchor: middle; }
    .lbl { fill: #0d1117; font-size: 13px; font-weight: 600; text-anchor: middle; }
    .sub { fill: #57606a; font-size: 10.5px; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #58a6ff; }
      .num { fill: #58a6ff; }
      .lbl { fill: #e6edf3; }
      .sub { fill: #8b949e; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="360" height="160" />
  <rect class="card" x="10" y="10" width="340" height="140" rx="12" />
  <text class="num" x="180" y="80">91.3%</text>
  <text class="lbl" x="180" y="108">blind eval accuracy</text>
  <text class="sub" x="180" y="128">MultinomialNB, alpha=0.25 (GridSearchCV)</text>
  <text class="sub" x="180" y="142">UCI SMS Spam Collection, 5169 msgs</text>
</svg>
