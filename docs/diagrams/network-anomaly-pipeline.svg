<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 190" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f0fbf4; stroke: #1a7f37; stroke-width: 2; }
    .boxend { fill: #eef2ff; stroke: #6366f1; stroke-width: 2; }
    .lbl { fill: #0d1117; font-size: 13px; font-weight: 600; text-anchor: middle; }
    .sub { fill: #57606a; font-size: 10px; text-anchor: middle; }
    .foot { fill: #57606a; font-size: 11px; text-anchor: start; }
    .arrow { stroke: #57606a; stroke-width: 2; fill: none; }
    .title { fill: #0d1117; font-size: 16px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3fb950; }
      .boxend { fill: #161b22; stroke: #a78bfa; }
      .lbl { fill: #e6edf3; }
      .sub { fill: #8b949e; }
      .foot { fill: #8b949e; }
      .arrow { stroke: #8b949e; }
      .title { fill: #e6edf3; }
    }
  </style>
  <defs>
    <marker id="ah2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" style="fill: currentColor;" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="950" height="190" />
  <text class="title" x="20" y="26">network anomaly detection — preprocessing + training pipeline</text>

  <g>
    <rect class="box" x="20" y="70" width="150" height="60" rx="10" />
    <text class="lbl" x="95" y="96">raw network</text>
    <text class="lbl" x="95" y="112">logs (NSL-KDD)</text>
  </g>
  <line class="arrow" x1="170" y1="100" x2="198" y2="100" marker-end="url(#ah2)" style="color:#57606a" />

  <g>
    <rect class="box" x="200" y="70" width="150" height="60" rx="10" />
    <text class="lbl" x="275" y="96">binary +</text>
    <text class="lbl" x="275" y="112">multiclass targets</text>
  </g>
  <line class="arrow" x1="350" y1="100" x2="378" y2="100" marker-end="url(#ah2)" style="color:#57606a" />

  <g>
    <rect class="box" x="380" y="70" width="150" height="60" rx="10" />
    <text class="lbl" x="455" y="96">one-hot encode</text>
    <text class="sub" x="455" y="112">protocol_type, service</text>
  </g>
  <line class="arrow" x1="530" y1="100" x2="558" y2="100" marker-end="url(#ah2)" style="color:#57606a" />

  <g>
    <rect class="box" x="560" y="70" width="150" height="60" rx="10" />
    <text class="lbl" x="635" y="96">join numeric</text>
    <text class="lbl" x="635" y="112">features (107 total)</text>
  </g>
  <line class="arrow" x1="710" y1="100" x2="738" y2="100" marker-end="url(#ah2)" style="color:#57606a" />

  <g>
    <rect class="boxend" x="740" y="70" width="190" height="60" rx="10" />
    <text class="lbl" x="835" y="96">train</text>
    <text class="sub" x="835" y="112">Random Forest Classifier</text>
  </g>

  <text class="foot" x="20" y="160">5 classes: normal, DoS, probe, privilege escalation, access. 148,517 connections total.</text>
  <text class="foot" x="20" y="176">Result: ~99.76% accuracy overall — but privilege escalation recall is only 24% (108 training samples vs 77k normal). See confusion matrices in module2-network-anomaly/results/.</text>
</svg>
