<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 190" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f0f6ff; stroke: #1f6feb; stroke-width: 2; }
    .boxend { fill: #eef2ff; stroke: #6366f1; stroke-width: 2; }
    .lbl { fill: #0d1117; font-size: 13px; font-weight: 600; text-anchor: middle; }
    .sub { fill: #57606a; font-size: 10px; text-anchor: middle; }
    .foot { fill: #57606a; font-size: 11px; text-anchor: start; }
    .arrow { stroke: #57606a; stroke-width: 2; fill: none; }
    .title { fill: #0d1117; font-size: 16px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #58a6ff; }
      .boxend { fill: #161b22; stroke: #a78bfa; }
      .lbl { fill: #e6edf3; }
      .sub { fill: #8b949e; }
      .foot { fill: #8b949e; }
      .arrow { stroke: #8b949e; }
      .title { fill: #e6edf3; }
    }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" class="arrow" style="fill: currentColor;" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1130" height="190" />
  <text class="title" x="20" y="26">spam classifier — text preprocessing pipeline</text>

  <!-- boxes: raw sms, lowercase, strip punct, tokenize, rm stopwords, stem, vectorize, train -->
  <g>
    <rect class="box" x="20" y="70" width="110" height="60" rx="10" />
    <text class="lbl" x="75" y="96">raw</text>
    <text class="lbl" x="75" y="112">sms</text>
  </g>
  <line class="arrow" x1="130" y1="100" x2="158" y2="100" marker-end="url(#ah)" style="color:#57606a" />

  <g>
    <rect class="box" x="160" y="70" width="110" height="60" rx="10" />
    <text class="lbl" x="215" y="96">lowercase</text>
    <text class="sub" x="215" y="112">.str.lower()</text>
  </g>
  <line class="arrow" x1="270" y1="100" x2="298" y2="100" marker-end="url(#ah)" style="color:#57606a" />

  <g>
    <rect class="box" x="300" y="70" width="110" height="60" rx="10" />
    <text class="lbl" x="355" y="96">strip</text>
    <text class="lbl" x="355" y="112">punct/nums</text>
  </g>
  <line class="arrow" x1="410" y1="100" x2="438" y2="100" marker-end="url(#ah)" style="color:#57606a" />

  <g>
    <rect class="box" x="440" y="70" width="110" height="60" rx="10" />
    <text class="lbl" x="495" y="96">tokenize</text>
    <text class="sub" x="495" y="112">nltk word_tokenize</text>
  </g>
  <line class="arrow" x1="550" y1="100" x2="578" y2="100" marker-end="url(#ah)" style="color:#57606a" />

  <g>
    <rect class="box" x="580" y="70" width="110" height="60" rx="10" />
    <text class="lbl" x="635" y="96">remove</text>
    <text class="lbl" x="635" y="112">stopwords</text>
  </g>
  <line class="arrow" x1="690" y1="100" x2="718" y2="100" marker-end="url(#ah)" style="color:#57606a" />

  <g>
    <rect class="box" x="720" y="70" width="110" height="60" rx="10" />
    <text class="lbl" x="775" y="96">stem</text>
    <text class="sub" x="775" y="112">PorterStemmer</text>
  </g>
  <line class="arrow" x1="830" y1="100" x2="858" y2="100" marker-end="url(#ah)" style="color:#57606a" />

  <g>
    <rect class="box" x="860" y="70" width="110" height="60" rx="10" />
    <text class="lbl" x="915" y="96">vectorize</text>
    <text class="sub" x="915" y="112">CountVectorizer</text>
  </g>
  <line class="arrow" x1="970" y1="100" x2="998" y2="100" marker-end="url(#ah)" style="color:#57606a" />

  <g>
    <rect class="boxend" x="1000" y="70" width="110" height="60" rx="10" />
    <text class="lbl" x="1055" y="96">train</text>
    <text class="sub" x="1055" y="112">MultinomialNB</text>
  </g>

  <text class="foot" x="20" y="160">$ and ! kept intentionally — they carry spam signal. Best alpha = 0.25 (GridSearchCV, 5-fold, scored on f1).</text>
  <text class="foot" x="20" y="176">Result: ~91% accuracy on blind eval · UCI SMS Spam Collection, 5169 messages</text>
</svg>
